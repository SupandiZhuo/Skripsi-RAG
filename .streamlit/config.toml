# Native widgets use the themes below; switch light/dark in Streamlit Settings.
[theme]
base = "light"
font = "sans-serif"
# Reserve native header/menu space so controls do not overlap.
paddingTop = "0.5rem"
paddingBottom = "2.5rem"

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fb"
textColor = "#14213d"

[theme.light.sidebar]
paddingTop = "0.25rem"
backgroundColor = "#f5f8fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#14213d"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"

[theme.dark.sidebar]
paddingTop = "0.25rem"
backgroundColor = "#161b22"
secondaryBackgroundColor = "#0d1117"
textColor = "#e6edf3"

# Hide developer actions while retaining the user-facing Streamlit menu.
[client]
toolbarMode = "viewer"

[server]
enableStaticServing = false
