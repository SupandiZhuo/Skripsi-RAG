[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "skripsi-rag"
version = "0.1.0"
description = "Context-aware vulnerability assessment using NVD and organizational RAG"
requires-python = "==3.12.14"
dependencies = [
    "streamlit>=1.66.1,<2",
    "pandas>=3.1.0,<4",
    "requests>=2.31.0",
    "cvss>=3.0",
    "langchain>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-huggingface[full]>=0.0.1",
    "langchain-google-genai>=1.0.0",
    "pydantic>=2.0,<3",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
required-version = ">=0.13.8"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"

# Embeddings run locally on CPU; do not pull CUDA libraries into the container.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
